services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    environment:
      DATABASE_URL: sqlite:////app/data/jenga_consultants.db
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JENGA_SECRET_KEY: ${JENGA_SECRET_KEY:-local-development-only-change-me}
      PORT: 8080
    volumes:
      - app-data:/app/data
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    restart: unless-stopped

volumes:
  app-data:
