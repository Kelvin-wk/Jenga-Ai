services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/data/jenga_consultants.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      JENGA_SECRET_KEY: ${JENGA_SECRET_KEY:-local-development-only-change-me}
      PORT: 8080
    volumes:
      - backend-data:/app/data
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  backend-data:
